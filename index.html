<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Space Cinema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Retro Space Cinema</h1>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Cari film favoritmu...">
            <button onclick="searchMovies()">Cari</button>
        </div>
    </header>

    <main>
        <div id="section-title" class="section-title">Film Rekomendasi Hari Ini</div>
        <div id="loading">Memuat data antariksa...</div>
        <div class="movie-grid" id="movie-grid"></div>
    </main>

    <div id="player-modal" class="player-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <div class="video-wrapper">
                <iframe id="video-iframe" src="" allowfullscreen></iframe>
            </div>
            <h2 id="modal-title" class="movie-detail-title">-</h2>
            <div id="modal-meta" class="movie-meta">-</div>
            <p id="modal-plot" class="movie-plot">-</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
