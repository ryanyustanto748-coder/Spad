<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAYARKACA21 - Nonton Film Streaming Online Sub Indo Terlengkap</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo"><i class="fas fa-film" style="color: #ff4757;"></i> LAYARKACA<span>21</span></div>
            <nav>
                <button id="btn-nav-home" class="active"><i class="fas fa-home"></i> Home</button>
                <button id="btn-nav-manage"><i class="fas fa-plus-circle"></i> Kelola Koleksi</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="section-home">
            <div class="search-wrapper">
                <h1>Nonton Film Online Subtitle Indonesia Gratis</h1>
                <p>Akses ribuan database film bioskop dunia terlengkap dan terupdate setiap hari.</p>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Cari judul film favorit Anda di sini...">
                    <button id="search-btn"><i class="fas fa-search"></i> Cari Film</button>
                </div>
            </div>

            <h2 class="section-title" id="grid-title"><i class="fas fa-fire" style="color: #ffa502;"></i> Rekomendasi Film Terpopuler</h2>
            <div id="movie-grid" class="movie-grid"></div>
        </section>

        <section id="section-manage" class="hidden">
            <div class="manage-container">
                <div class="form-card">
                    <h2 id="form-title">Tambah Video Kustom</h2>
                    <form id="movie-form">
                        <input type="hidden" id="movie-id">
                        
                        <div class="form-group">
                            <label for="movie-title">Judul Film</label>
                            <input type="text" id="movie-title" required placeholder="Contoh: Film Indie Keren">
                        </div>
                        
                        <div class="form-group">
                            <label for="movie-year">Tahun Rilis</label>
                            <input type="number" id="movie-year" required placeholder="Contoh: 2026">
                        </div>

                        <div class="form-group">
                            <label for="movie-poster">URL Poster Gambar</label>
                            <input type="url" id="movie-poster" placeholder="https://domain.com/poster.jpg">
                        </div>

                        <div class="form-group">
                            <label for="movie-video">URL Video Player</label>
                            <input type="url" id="movie-video" placeholder="Link .mp4 / YouTube">
                        </div>

                        <div class="form-group">
                            <label for="movie-plot">Sinopsis</label>
                            <textarea id="movie-plot" rows="4" required placeholder="Tulis sinopsis..."></textarea>
                        </div>

                        <div class="form-buttons">
                            <button type="submit" id="submit-btn" class="btn-primary">Simpan</button>
                            <button type="button" id="cancel-btn" class="btn-secondary hidden">Batal</button>
                        </div>
                    </form>
                </div>

                <div class="custom-list-card">
                    <h2>Koleksi Lokal</h2>
                    <div id="custom-movies-list"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="movie-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 LAYARKACA21 Mega Klon. Streaming Bioskop Online Terlengkap.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
