<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NekoStream - Banyak Katalog & Pencarian Instan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <span class="brand-title"><i class="fa-solid fa-bolt me-2"></i>NekoStream</span>
        <span class="badge bg-danger">MOBILE v2</span>
    </header>

    <div id="playerSection" class="d-none">
        <div class="video-container">
            <iframe id="mainIframe" src="" allowfullscreen allow="autoplay"></iframe>
        </div>
        <div class="player-details">
            <h5 id="nowPlayingTitle" class="text-white mb-2">Judul Anime</h5>
            <div class="server-box">
                <p class="text-muted small mb-2"><i class="fa-solid fa-server me-1"></i> Pilih Server (Ganti jika tidak berputar):</p>
                <div id="serverList" class="d-flex flex-wrap gap-2"></div>
            </div>
            <a id="adsterraDownloadBtn" href="#" target="_blank" class="btn-download">
                <i class="fa-solid fa-circle-down me-2"></i>Download / Streaming Alt
            </a>
            <p class="text-center text-muted mt-2 mb-0" style="font-size: 0.7rem;">*Jika terbuka tab iklan baru, tutup saja lalu klik download kembali.</p>
        </div>
    </div>

    <div class="p-3 search-sticky-box">
        <div class="input-group">
            <span class="input-group-text search-icon-container"><i class="fa-solid fa-magnifying-glass text-white"></i></span>
            <input type="text" id="searchField" class="form-control input-search" placeholder="Ketik untuk cari dari puluhan anime...">
        </div>
    </div>

    <div id="homeTab" class="content-tab">
        <h5 class="section-title" id="katalogTitle">Semua Katalog Anime</h5>
        <div class="row row-cols-2 gx-3 gy-3 px-3" id="animeGrid"></div>
    </div>

    <footer class="text-center text-muted py-4 mt-4" style="font-size: 0.8rem; margin-bottom: 60px;">
        <p>&copy; NekoStream - Katalog Banyak Terintegrasi API</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
